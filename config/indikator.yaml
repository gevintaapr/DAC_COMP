# Metadata & aturan validasi setiap indikator level provinsi.
# peran:
#   inti         -> dipakai di dashboard & analisis utama (wajib lengkap 38 provinsi di tahun_analisis)
#   pendukung    -> dipakai sebagai konteks / pelengkap
#   sensitivitas -> hanya untuk uji ketahanan hasil (bukan angka utama)
# arah: positif = makin tinggi makin baik; negatif = makin rendah makin baik

RLS:
  nama: Rata-rata Lama Sekolah
  lapisan: Input pendidikan
  satuan: tahun
  periode: Tahunan (Susenas Maret)
  min: 0
  max: 16
  arah: positif
  peran: inti
